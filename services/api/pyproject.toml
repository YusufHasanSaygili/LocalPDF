[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "localpdf-api"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "beautifulsoup4==4.15.0",
  "ctranslate2==4.8.1",
  "fastapi==0.141.1",
  "onnxruntime==1.28.0",
  "openpyxl==3.1.5",
  "pikepdf==10.11.0",
  "Pillow==12.3.0",
  "python-docx==1.2.0",
  "PyMuPDF==1.26.4",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "rapidocr==3.9.2",
  "reportlab==4.4.3",
  "SQLAlchemy==2.0.52",
  "sentencepiece==0.2.2",
  "uvicorn[standard]==0.52.3"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
  "types-reportlab==4.5.1.20260807"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
